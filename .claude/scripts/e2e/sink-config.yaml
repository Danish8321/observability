# The e2e sink. Stands in for the store so that what is asserted on is
# telemetry that came out of the collector under test, after its policy ran.
#
# The shipped deploy/collector/config.yaml sends traces, logs and metrics over
# OTLP/http, each to an endpoint from the environment. The e2e scripts point
# all three here, the same knob Infra sets, so that config runs byte-for-byte
# unmodified. A test that edits the thing it is testing proves nothing.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file:
    path: /out/received.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
    metrics:
      receivers: [otlp]
      exporters: [file]
    logs:
      receivers: [otlp]
      exporters: [file]
