# The local stack: the two reference services, NATS, CouchDB, the collector,
# and the stores behind it — Loki (logs), Mimir (metrics), Tempo (traces),
# Grafana, and SeaweedFS standing in for S3. The collector, Loki, Mimir and
# Grafana config files are the ones handed to Infra (plan R6,
# deploy/HANDOFF.md); only the environment below is local. Tempo is local only:
# Infra has not chosen the production trace store.
#
# 🔒 Dummy data only (ADR-0022).

# S3 settings shared by every store. The keys match seaweedfs/s3.json and exist
# only here; in production the pod's IAM role supplies credentials instead.
x-s3-env: &s3-env
  S3_ENDPOINT: seaweedfs-s3:8333
  S3_REGION: us-east-1
  S3_INSECURE: "true"
  S3_FORCE_PATH_STYLE: "true"
  S3_BUCKET_LOOKUP_TYPE: path
  AWS_ACCESS_KEY_ID: local-stack-access-key
  AWS_SECRET_ACCESS_KEY: local-stack-secret-key

services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring endpoint — also an estate discovery source

  # NATS speaks JSON on :8222 (/varz, /connz, /jsz), not prometheus text, and
  # the collector has no NATS receiver. This is the NATS project's own exporter
  # translating one into the other so the collector can scrape it — the only
  # route from broker health into the pipeline (ADR-0030).
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    command: ["-varz", "-connz", "-subz", "-jsz=all", "http://nats:8222"]
    ports:
      - "7777:7777"   # exposed for `curl` while building panels, not required
    depends_on:
      - nats

  couchdb:
    image: couchdb:3.5
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data

  # The services do not create their database. Reuses the CouchDB image for
  # its curl.
  couchdb-init:
    image: couchdb:3.5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until curl -sf http://admin:password@couchdb:5984/_up >/dev/null; do
          i=$$((i + 1)); [ "$$i" -gt 120 ] && echo "couchdb never came up" && exit 1
          sleep 1
        done
        # 412: created by an earlier run on this volume.
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://admin:password@couchdb:5984/kyc)
        case "$$code" in
          201|202|412) echo "database kyc ready" ;;
          *) echo "PUT /kyc returned $$code" && exit 1 ;;
        esac
    depends_on:
      - couchdb

  # Local S3. One bucket per store, as in production (plan, starting point).
  # Master, volume and filer here; the S3 gateway is its own service below.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-filer"]
    volumes:
      - seaweedfs-data:/data

  # Neither Loki nor Mimir creates its bucket; in production Infra does.
  # weed shell exits 0 even when a command fails, so success is read back
  # from the bucket list rather than from the exit code.
  buckets:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in loki mimir; do
          i=0
          until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw "$$b"; do
            i=$$((i + 1)); [ "$$i" -gt 120 ] && echo "bucket $$b never created" && exit 1
            echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1
            sleep 1
          done
          echo "bucket $$b ready"
        done
    depends_on:
      - seaweedfs

  # Started only once the buckets exist: a gateway running while they are
  # created caches them as missing and answers NoSuchBucket until restarted.
  # Standalone, it binds 127.0.0.1 unless told otherwise.
  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.97
    command: ["s3", "-filer=seaweedfs:8888", "-ip.bind=0.0.0.0", "-port=8333", "-config=/etc/seaweedfs/s3.json"]
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 30
    depends_on:
      buckets:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      <<: *s3-env
      LOKI_S3_BUCKET: loki
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"
    depends_on:
      seaweedfs-s3:
        condition: service_healthy

  mimir:
    image: grafana/mimir:2.17.0
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true"]
    environment:
      <<: *s3-env
      MIMIR_S3_BUCKET: mimir
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
    ports:
      - "9009:9009"
    depends_on:
      seaweedfs-s3:
        condition: service_healthy

  # Local only, on local disk (header). The image creates /var/tempo for its
  # own uid, so a fresh volume starts with the right owner.
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      MIMIR_URL: http://mimir:9009/prometheus
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Alert email goes to Mailpit locally; SES (or any relay) in production.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: alerts@raksawi.local
      ALERT_EMAIL_TO: oncall@raksawi.local
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"   # admin/admin locally
    depends_on:
      - loki
      - mimir
      - tempo
      - mailpit

  # The local mail catcher (plan Q13): every alert email lands here, readable
  # at localhost:8025 and through its API, which e2e-alerting.sh asserts on.
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "8025:8025"

  # A fresh named volume is root-owned and the collector runs as uid 10001
  # with no shell to fix it, so the persistent queue could not be opened.
  queue-permissions:
    image: busybox:1.36
    user: "0"
    command: ["chown", "-R", "10001:10001", "/var/lib/otelcol/storage"]
    volumes:
      - collector-queue:/var/lib/otelcol/storage

  collector:
    image: otel/opentelemetry-collector-contrib:0.140.1
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # Passed through only when set: e2e-alerting.sh sets it to break the Loki
      # export on purpose. Unset, config.yaml's default applies.
      LOKI_OTLP_ENDPOINT:
      # Not staging: the platform alerts ignore staging (plan R5), and this
      # stack has to fire them.
      DEPLOYMENT_ENVIRONMENT_NAME: local
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
      - collector-queue:/var/lib/otelcol/storage
    ports:
      # Demo-only host port, kept from when SigNoz's ingester held 4318. A
      # service run on the host sets Otlp:Endpoint to http://localhost:4319.
      - "4319:4318"   # OTLP http/protobuf. 4317 is deliberately not exposed
    depends_on:
      queue-permissions:
        condition: service_completed_successfully
      nats:
        condition: service_started
      loki:
        condition: service_started
      mimir:
        condition: service_started
      tempo:
        condition: service_started

  # The reference services, built from this source (samples/Dockerfile;
  # deploy/README.md says why not from packages). They reach CouchDB as
  # "couchdb", the host the collector's url.full rule keeps.
  screening-worker:
    build:
      context: ..
      dockerfile: samples/Dockerfile
      args:
        PROJECT: Screening.Worker
    environment: &service-env
      Otlp__Endpoint: http://collector:4318
      CouchDb__Url: http://admin:password@couchdb:5984
      Nats__Url: nats://nats:4222
    depends_on: &service-deps
      couchdb-init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      collector:
        condition: service_started

  screening-api:
    build:
      context: ..
      dockerfile: samples/Dockerfile
      args:
        PROJECT: Screening.Api
    environment: *service-env
    ports:
      - "5206:8080"   # the port dotnet run uses (launchSettings.json)
    depends_on: *service-deps

volumes:
  couchdb-data:
  collector-queue:
  seaweedfs-data:
  tempo-data:

# The stack joins this network rather than creating it. Create it once:
#
#   docker network create observability
#
networks:
  default:
    name: observability
    external: true
