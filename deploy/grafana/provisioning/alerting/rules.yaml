# Platform alerts: the stack watching itself (plan D3, ADR-0040). Service
# alerts (plan D4) are the second group, below; "a service stopped reporting"
# arrives in D11, with the register.
#
# 🔒 The collector's own metrics reach Mimir through the collector's Mimir
# exporter. So every rule on them answers "is the collector reporting", not
# "is the collector alive", and a broken Mimir path looks like a dead
# collector. Two consequences, both deliberate:
#   - these rules treat a failed query as OK (execErrState: OK), so a Mimir
#     outage sends the store email alone rather than also blaming the collector;
#   - "Collector not reporting" names both causes, and its runbook separates
#     them.
#
# Collector rules ignore staging (plan R5) by deployment_environment_name,
# which Mimir promotes onto every series (mimir.yaml). The local stack's
# collector is "local", so it fires them; e2e-alerting.sh asserts the label
# exists, because without it the != matcher matches everything and staging
# again hides production.
#
# Annotations are not environment-interpolated by Grafana, so runbook links
# are written out in full.
apiVersion: 1

groups:
  - orgId: 1
    name: platform
    folder: Platform
    interval: 1m
    rules:
      - uid: collector-not-reporting
        title: Collector not reporting
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 1 when the self-scrape has written nothing for 2 minutes. While
              # it reports, the result is empty, which is the healthy case.
              expr: absent_over_time(up{job="otelcol", deployment_environment_name!="staging"}[2m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # 2m of absence above plus 3m pending: about 5 minutes to the email.
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          component: collector
        annotations:
          summary: The collector's own metrics have stopped reaching Mimir.
          description: >-
            Either the collector is down, or its metrics export to Mimir is
            failing. Both stop every signal from reaching storage. Check the
            collector process first.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/collector-not-reporting.md

      - uid: collector-export-stalled
        title: Export stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # Finding 07: with retry on, a failing export never resolves, so
              # sent and send_failed are both flat or absent. What moves is the
              # queue. Held work with nothing sent is the outage.
              expr: |
                max by (deployment_environment_name, exporter) (otelcol_exporter_queue_size{deployment_environment_name!="staging"}) > 0
                unless on (deployment_environment_name, exporter)
                sum by (deployment_environment_name, exporter) (rate({__name__=~"otelcol_exporter_sent_(spans|metric_points|log_records)_total"}[5m])) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          component: collector
        annotations:
          summary: "Exporter {{ $labels.exporter }} ({{ $labels.deployment_environment_name }}) is holding data and sending none."
          description: >-
            The collector is receiving but cannot deliver to the store behind
            {{ $labels.exporter }}. Data waits in the persistent queue until it
            is full, then is dropped.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/collector-export-stalled.md

      - uid: collector-queue-filling
        title: Collector queue filling
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: max by (deployment_environment_name, exporter) (otelcol_exporter_queue_size{deployment_environment_name!="staging"} / otelcol_exporter_queue_capacity)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          component: collector
        annotations:
          summary: "Exporter {{ $labels.exporter }} ({{ $labels.deployment_environment_name }}) queue is over 80% full."
          description: >-
            When the queue is full, new data for this exporter is dropped.
            The queue size is a placeholder, not sized from a measured outage.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/collector-queue-filling.md

      # The store rules ask the store a question that always has an answer.
      # A failed query is the alert (execErrState: Alerting), evaluated by
      # Grafana itself, so it fires with the pipeline down too.
      - uid: store-unreachable-mimir
        title: "Store unreachable: Mimir"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: vector(1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          component: store
        annotations:
          summary: Grafana cannot query Mimir.
          description: >-
            Metrics cannot be read, and every metric alert is blind. The
            collector holds metrics in its queue until Mimir returns.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/store-unreachable.md

      - uid: store-unreachable-loki
        title: "Store unreachable: Loki"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: vector(1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          component: store
        annotations:
          summary: Grafana cannot query Loki.
          description: >-
            Logs cannot be read. The collector holds logs in its queue until
            Loki returns.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/store-unreachable.md

      # The broker (plan D5, ADR-0030). The count is of connections the server
      # dropped for not reading, which is data already lost on core NATS, so
      # one is enough and there is no "for". It is not lag: a NATS.Net
      # subscriber that falls behind drops messages in the client instead
      # (DropNewest) and this never moves. "Delivery gap" covers that.
      - uid: slow-consumer
        title: Slow consumer
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: |
                sum by (deployment_environment_name, instance) (
                  increase(gnatsd_varz_slow_consumers{job="nats", deployment_environment_name!="staging"}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          component: broker
        annotations:
          summary: "NATS ({{ $labels.instance }}, {{ $labels.deployment_environment_name }}) disconnected a subscriber that stopped reading."
          description: >-
            The server dropped a connection for falling behind, and the
            messages it held for that subscriber are gone. Core NATS does not
            redeliver them.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/slow-consumer.md

      # Every broker rule reads the exporter's scrape, so a dead exporter turns
      # "Slow consumer" into no data, which is OK. up is 0, not absent, while
      # the collector keeps scraping; a stopped collector is its own email.
      - uid: broker-metrics-missing
        title: Broker metrics missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: min by (deployment_environment_name, instance) (up{job="nats", deployment_environment_name!="staging"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          component: broker
        annotations:
          summary: "The collector cannot scrape NATS broker metrics from {{ $labels.instance }} ({{ $labels.deployment_environment_name }})."
          description: >-
            prometheus-nats-exporter is not answering, so "Slow consumer" cannot
            fire. The broker itself may be healthy.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/broker-metrics-missing.md

      # Always firing, from an expression alone so it depends on no store.
      # Routed to a 24h repeat in notifications.yaml.
      - uid: alerting-heartbeat
        title: Alerting heartbeat
        condition: A
        data:
          - refId: A
            datasourceUid: __expr__
            model:
              refId: A
              type: math
              expression: "1"
        for: 0s
        noDataState: Alerting
        execErrState: Alerting
        labels:
          component: alerting
          heartbeat: "true"
        annotations:
          summary: Alerting is alive. This email arrives once a day.
          description: >-
            If a day passes without it, Grafana or its email delivery is
            down, and no other alert can reach you.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/alerting-heartbeat.md

  # Service alerts: what a service's own metrics say about its work (plan D4,
  # thresholds plan M9). Like the collector rules they ignore staging, and a
  # failed query is OK: "Store unreachable: Mimir" already says so.
  - orgId: 1
    name: services
    folder: Services
    interval: 1m
    rules:
      - uid: work-abandoned
        title: Work abandoned
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # A reason abandoned for the first time arrives as a new series
              # already at 1, which increase() alone never sees; the second
              # half catches a series younger than the window. 10m, so one
              # abandonment stays true through the 5m "for".
              expr: |
                sum by (deployment_environment_name, job, reason) (
                    increase(screening_applications_abandoned{deployment_environment_name!="staging"}[10m]) > 0
                  or
                    (screening_applications_abandoned{deployment_environment_name!="staging"}
                      unless screening_applications_abandoned{deployment_environment_name!="staging"} offset 10m)
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          component: service
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.deployment_environment_name }}) abandoned applications: {{ $labels.reason }}."
          description: >-
            Screening failed permanently. Each submitter was told 202, the
            application stays "received", and nothing retries it.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/work-abandoned.md

      # Both HTTP rules need 20 requests on the route in the window, so one
      # failed or slow request on a quiet route emails no one. A status code
      # seen for the first time arrives as a new series, and rate() counts
      # nothing for a series' first sample; under the sustained traffic these
      # rules are for, the next sample counts.
      - uid: error-rate
        title: Error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: |
                sum by (deployment_environment_name, job, http_route) (
                  increase(http_server_request_duration_count{deployment_environment_name!="staging", http_response_status_code=~"5.."}[10m]))
                /
                sum by (deployment_environment_name, job, http_route) (
                  increase(http_server_request_duration_count{deployment_environment_name!="staging"}[10m]))
                and
                sum by (deployment_environment_name, job, http_route) (
                  increase(http_server_request_duration_count{deployment_environment_name!="staging"}[10m])) >= 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          component: service
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.deployment_environment_name }}): more than 5% of requests to {{ $labels.http_route }} fail with a 5xx."
          description: >-
            Callers of this route are getting server errors, and have been for
            ten minutes.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/error-rate.md

      - uid: latency
        title: Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: |
                histogram_quantile(0.95, sum by (deployment_environment_name, job, http_route, le) (
                  rate(http_server_request_duration_bucket{deployment_environment_name!="staging"}[10m])))
                and
                sum by (deployment_environment_name, job, http_route) (
                  increase(http_server_request_duration_count{deployment_environment_name!="staging"}[10m])) >= 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          component: service
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.deployment_environment_name }}): 95th percentile of {{ $labels.http_route }} is above 2 s."
          description: >-
            One request in twenty to this route takes longer than two seconds,
            and has for ten minutes.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/latency.md

      # 2.5 s, not the plan's first 10 s: the demo's slow fault adds 3 s, so
      # 10 s could never be seen to fire. A healthy screening takes about 10 ms.
      # The same 20-measurement floor as the HTTP rules: one slow screening on
      # a quiet worker is not "screening is slow".
      - uid: screening-slow
        title: Screening slow
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: |
                histogram_quantile(0.95, sum by (deployment_environment_name, job, le) (
                  rate(screening_duration_bucket{deployment_environment_name!="staging"}[10m])))
                and
                sum by (deployment_environment_name, job) (
                  increase(screening_duration_count{deployment_environment_name!="staging"}[10m])) >= 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2.5] }
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          component: service
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.deployment_environment_name }}): 95th percentile of screening is above 2.5 s."
          description: >-
            One application in twenty takes longer than two and a half seconds
            to screen, and has for ten minutes. Submitters are not told: the
            API answered 202 long before.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/screening-slow.md

      # Plan D5. Core NATS has no backlog to measure (panel 3.2), so the gap is
      # read at the ends: applications accepted against applications the
      # worker finished, either way. Below 90% for ten minutes the worker is
      # behind, stopped, or dropping (NATS.Net drops newest when its buffer is
      # full). The "or 0 *" keeps a worker with no series left (stopped) at 0
      # handled rather than no result. Across jobs: the two counts come from
      # two services.
      - uid: delivery-gap
        title: Delivery gap
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: |
                (
                    sum by (deployment_environment_name) (
                      increase({__name__=~"screening_applications_(screened|abandoned)", deployment_environment_name!="staging"}[10m]))
                  or
                    0 * sum by (deployment_environment_name) (
                      increase(http_server_request_duration_count{deployment_environment_name!="staging", http_route="/applications", http_request_method="POST", http_response_status_code="202"}[10m]))
                )
                /
                sum by (deployment_environment_name) (
                  increase(http_server_request_duration_count{deployment_environment_name!="staging", http_route="/applications", http_request_method="POST", http_response_status_code="202"}[10m]))
                and
                sum by (deployment_environment_name) (
                  increase(http_server_request_duration_count{deployment_environment_name!="staging", http_route="/applications", http_request_method="POST", http_response_status_code="202"}[10m])) >= 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.9] }
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          component: service
        annotations:
          summary: "Screening ({{ $labels.deployment_environment_name }}) finished fewer than 90% of the applications it accepted in ten minutes."
          description: >-
            Applications are accepted with a 202 and not screened. The worker
            is behind, stopped, or dropping messages; on core NATS a message
            with no reader is gone.
          runbook_url: https://github.com/Danish8321/observability/blob/main/docs/runbooks/delivery-gap.md
