# Data sources, provisioned from file rather than clicked together, so the
# local stack and production read the same definitions (plan R6). URLs come
# from the environment; uids are fixed because dashboards and alert rules
# reference them.
#
# Tempo is the local stack's trace store. Infra has not chosen production's
# (ClickHouse or Tempo); the Tempo entry holds only if it is Tempo.
apiVersion: 1

datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    url: ${MIMIR_URL}
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    url: ${LOKI_URL}
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    url: ${TEMPO_URL}
    editable: false
    jsonData:
      # Explore then searches through the data source proxy to Tempo's HTTP
      # API, the path e2e-demo.sh checks. Streaming needs gRPC from Tempo
      # (stream_over_http_enabled) and cannot be checked with curl.
      streamingEnabled:
        search: false
